spring:
  application:
    name: vehicle-management-system
  server:
    port: 8081

  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:5433/${POSTGRES_DB:vehicle_db}
    username: ${POSTGRES_USER:user}
    password: ${POSTGRES_PASSWORD:pass123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: 5672
    username: ${RABBITMQ_DEFAULT_USER:user}
    password: ${RABBITMQ_DEFAULT_PASS:pass123}

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: 86400000